<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./images/SesnaQuake.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SesnaQuake</title>
    <meta name="theme-color" content="#19b0c8"/>
    <meta name="description" content="Track earthquakes reported by JMA in real-time!">
    <meta name="title" content="SesnaQuake"/>
    <meta name="author" content="Domiko"/>
    <meta name="email" content="domikobusiness@gmail.com"/>
    <meta property="og:title" content="SesnaQuake" />
    <meta property="og:description" content="Track earthquakes reported by JMA in real-time!" />
    <meta property="og:image" content="./images/SesnaQuake.png" />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="SesnaQuake">
    <meta name="twitter:description" content="Track earthquakes reported by JMA in real-time!">
    <meta name="twitter:image" content="./images/SesnaQuake.png">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400..700;1,400..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <script type="module" crossorigin src="./assets/index-BuDczqEL.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-Bp06fUYI.css">
  </head>
  <body>
    <div id="app">
      <div id="map"></div>

      <div id="cookie-banner">
        <p id="cookie-banner-text" data-i18n="cookieText"></p>
        <button id="cookie-banner-button">OK</button>
      </div>

      <div id="debug-info">
        <div class="debug-info-block">
          <p class="debug-info__title">FPS:</p>
          <p class="debug-info__label debug-info__unknown-color debug-info__fps-text">Unknown</p>
        </div>
        <div class="debug-info-block">
          <p class="debug-info__title">Version:</p>
          <p class="debug-info__label debug-info__unknown-color debug-info__version-text">Unknown</p>
        </div>
        <div class="debug-info-block">
          <p class="debug-info__title">Server:</p>
          <p class="debug-info__label debug-info__server-connection-text debug-info__server-connection-wolfx">wolfx</p>
          <p class="debug-info__label debug-info__server-connection-text debug-info__server-connection-p2p">P2P</p>
          <p class="debug-info__label debug-info__server-connection-text debug-info__server-connection-dmdata">dmdata.jp</p>
        </div>
      </div>

      <div id="clock">
        <span id="time">----/--/-- --:--:--</span>
      </div>

      <div id="realtime-info">
        <div id="event-panel">
          <div class="event-panel__header">
            <span class="event-panel__title" data-i18n="eewInactive"></span>
            <span class="event-panel__report-label transparent" data-i18n="reportNumber"></span>
            <span class="event-panel__report-value transparent">&nbsp;#15</span>
          </div>
          <div class="event-panel__content transparent">
            <div class="event-panel__intensity">
              <span class="event-panel__seismic-intensity-label" data-i18n="intensity">Seismic intensity</span>
              <span class="event-panel__seismic-intensity-value">3</span>
            </div>
            <div class="event-panel__details">
              <span class="event-panel__location">Seas near Tokara Islands</span>
              <span class="event-panel__time">2025/09/27 19:56:12</span>
              <div class="event-panel__info">
                <span class="event-panel__magnitude">M5.1</span>
                <span class="event-panel__depth">10km</span>
              </div>
            </div>
          </div>
        </div>
        <div class="realtime-int">
          <span class="realtime-int__label">
            Max. acc. (est.)
          </span>
          <span class="realtime-int__value">
            0.0 PGA
          </span>
        </div>
      </div>

      <div id="info">
        <div id="info-panel">
          <div class="past-events">

            <div class="past-event jma-past-event">
              <div class="past-event__intensity">
                <span class="past-event__seismic-intensity-value">3</span>
              </div>

              <div class="past-event__details">
                <span class="past-event__location">Seas near Tokara Islands</span>
                <span class="past-event__time">2025/09/27 19:56:12</span>
              </div>

              <span class="past-event__magnitude">M5.1</span>
            </div>

          </div>
        </div>
      </div>

    </div>
  </body>
</html>
